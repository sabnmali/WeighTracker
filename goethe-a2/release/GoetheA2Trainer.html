id:`fe-weil-verbende`,q:z,tr:B,o:[`Ich komme nicht, weil ich krank bin.`,`Er bleibt zu Hause, weil er hat hohes Fieber.`,`Sie lernt viel, weil sie die Prüfung bestehen will.`,`Wir gehen nicht raus, weil es regnet.`],a:`Er bleibt zu Hause, weil er hat hohes Fieber.`,ex:`„weil“ yan cümle kurar ve çekimli fiil cümlenin SONUNA gider: …, weil er hohes Fieber HAT.`,rule:`Nebensatz: weil + Verb am Ende`,trap:`Konuşma dilinde duyulan „weil + ana cümle düzeni“ sınavda yanlış sayılır.`},{id:`fe-warten-auf`,q:z,tr:B,o:[`Ich warte für den Bus.`,`Ich freue mich auf das Wochenende.`,`Wir denken oft an unsere Großeltern.`,`Er interessiert sich für Fußball.`],a:`Ich warte für den Bus.`,ex:`„warten“ fiili „auf + Akkusativ“ ile kullanılır: Ich warte AUF den Bus. „für“, İngilizce "wait for" çevirisinden gelen tipik bir hatadır.`,rule:`Verb + Präposition: warten auf + Akk`,trap:`İngilizce "wait for" → „warten für“ diye birebir çeviri.`,word:`warten`},{id:`fe-mit-dativ`,q:z,tr:B,o:[`Er fährt jeden Tag mit die Straßenbahn.`,`Ich fahre mit dem Fahrrad zur Arbeit.`,`Sie wohnt bei ihrer Tante.`,`Nach dem Essen trinken wir Kaffee.`],a:`Er fährt jeden Tag mit die Straßenbahn.`,ex:`„mit“ her zaman Dativ ister. die Straßenbahn → mit DER Straßenbahn.`,rule:`Dativpräpositionen: mit, bei, nach, zu, von, aus, seit`,trap:`Yalın hâldeki artikeli (die) olduğu gibi bırakmak.`},{id:`fe-legen-akk`,q:z,tr:B,o:[`Ich lege das Buch auf dem Tisch.`,`Das Buch liegt auf dem Tisch.`,`Sie hängt das Bild an die Wand.`,`Die Lampe steht neben dem Sofa.`],a:`Ich lege das Buch auf dem Tisch.`,ex:`„legen“ bir hareket/yön bildirir (Wohin?) → Akkusativ: Ich lege das Buch auf DEN Tisch. „liegen“ ise konum bildirir (Wo?) → Dativ.`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`,trap:`legen/liegen, stellen/stehen, hängen (koymak)/hängen (asılı durmak) çiftlerini karıştırmak.`,d:`A2.2`},{id:`fe-trennbar-anrufen`,q:z,tr:B,o:[`Er anruft seine Kollegin jeden Abend.`,`Er ruft seine Kollegin jeden Abend an.`,`Ich stehe um sechs Uhr auf.`,`Wann kommt der Zug an?`],a:`Er anruft seine Kollegin jeden Abend.`,ex:`Ayrılabilen fiillerde ön ek (an-) ana cümlede cümlenin sonuna gider: Er RUFT seine Kollegin jeden Abend AN.`,rule:`Trennbare Verben: Präfix am Satzende`,trap:`Mastar hâlini (anrufen) bölmeden kullanmak.`,word:`anrufen`},{id:`fe-obwohl-aber`,q:z,tr:B,o:[`Obwohl es regnet, aber wir gehen spazieren.`,`Obwohl es regnet, gehen wir spazieren.`,`Es regnet, trotzdem gehen wir spazieren.`,`Es regnet, aber wir gehen spazieren.`],a:`Obwohl es regnet, aber wir gehen spazieren.`,ex:`„obwohl“ zaten karşıtlık bildirir; ikinci cümlede ayrıca „aber“ kullanılmaz. Yan cümle başta olduğu için ana cümle fiille başlar: Obwohl es regnet, GEHEN wir spazieren.`,rule:`Konnektoren: obwohl (keine Doppelkonjunktion)`,trap:`Türkçedeki "-mesine rağmen … ama" yapısını Almancaya taşımak.`,d:`A2.2`},{id:`fe-inversion-morgen`,q:z,tr:B,o:[`Morgen ich fahre nach Berlin.`,`Morgen fahre ich nach Berlin.`,`Ich fahre morgen nach Berlin.`,`Nach Berlin fahre ich morgen.`],a:`Morgen ich fahre nach Berlin.`,ex:`Almanca ana cümlede çekimli fiil her zaman 2. pozisyondadır. Cümle „Morgen“ ile başlıyorsa özne fiilden sonra gelir: Morgen FAHRE ich …`,rule:`Satzbau: Verb an Position 2 (Inversion)`,trap:`İngilizcedeki "Tomorrow I go" düzenini kopyalamak.`},{id:`fe-deshalb-inversion`,q:z,tr:B,o:[`Ich bin müde, deshalb ich gehe ins Bett.`,`Ich bin müde, deshalb gehe ich ins Bett.`,`Ich gehe ins Bett, weil ich müde bin.`,`Weil ich müde bin, gehe ich ins Bett.`],a:`Ich bin müde, deshalb ich gehe ins Bett.`,ex:`„deshalb“ bir zarftır ve 1. pozisyonu doldurur; fiil hemen ardından gelir: deshalb GEHE ich ins Bett.`,rule:`Konnektoren: deshalb/trotzdem + Inversion`,trap:`„deshalb“u „und“ gibi 0. pozisyonda sanmak.`},{id:`fe-dass-verbende`,q:z,tr:B,o:[`Ich glaube, dass er heute nicht kommt.`,`Sie sagt, dass sie keine Zeit hat.`,`Ich weiß, dass du hast recht.`,`Es ist schön, dass ihr da seid.`],a:`Ich weiß, dass du hast recht.`,ex:`„dass“ yan cümlesinde çekimli fiil sona gider: …, dass du recht HAST.`,rule:`Nebensatz: dass + Verb am Ende`},{id:`fe-modal-infinitiv`,q:z,tr:B,o:[`Ich muss heute arbeiten lange.`,`Ich muss heute lange arbeiten.`,`Kannst du mir bitte helfen?`,`Wir wollen am Samstag ins Kino gehen.`],a:`Ich muss heute arbeiten lange.`,ex:`Modal fiilli cümlede (müssen, können, wollen…) ikinci fiil mastar hâlinde EN SONA gider: Ich muss heute lange ARBEITEN.`,rule:`Modalverben: Infinitiv am Satzende`},{id:`fe-modal-praet-endung`,q:z,tr:B,o:[`Ich konntest gestern nicht kommen.`,`Du konntest gestern nicht kommen.`,`Wir mussten lange warten.`,`Sie wollte Ärztin werden.`],a:`Ich konntest gestern nicht kommen.`,ex:`Modal fiillerin Präteritum çekimi: ich konnte, du konntest, er/sie konnte, wir konnten, ihr konntet, sie/Sie konnten. „ich“ ile ek almaz: Ich KONNTE …`,rule:`Modalverben im Präteritum`,trap:`„du“ çekim ekini (-st) „ich“e uygulamak.`,d:`A2.2`},{id:`fe-helfen-dativ`,q:z,tr:B,o:[`Kannst du mich helfen?`,`Kannst du mir helfen?`,`Das Kleid gefällt mir.`,`Ich danke dir für die Einladung.`],a:`Kannst du mich helfen?`,ex:`„helfen“ Dativ alan bir fiildir: Kannst du MIR helfen? (helfen, danken, gefallen, gehören, antworten, gratulieren → Dativ)`,rule:`Verben mit Dativ: helfen, danken, gefallen, gehören`,trap:`Türkçede "beni yardım" denmediği hâlde İngilizce "help me" etkisiyle Akkusativ kullanmak.`,word:`helfen`},{id:`fe-gefallen-dativ`,q:z,tr:B,o:[`Die Wohnung gefällt mich sehr.`,`Die Wohnung gefällt mir sehr.`,`Der Film hat uns gut gefallen.`,`Gehört das Fahrrad dir?`],a:`Die Wohnung gefällt mich sehr.`,ex:`„gefallen“ Dativ ister: Die Wohnung gefällt MIR sehr. Özne „die Wohnung“dur, beğenen kişi Dativ’dedir.`,rule:`Verben mit Dativ: helfen, danken, gefallen, gehören`},{id:`fe-akk-einen`,q:z,tr:B,o:[`Ich habe ein Bruder und eine Schwester.`,`Ich habe einen Bruder und eine Schwester.`,`Wir suchen eine neue Wohnung.`,`Er kauft ein Auto.`],a:`Ich habe ein Bruder und eine Schwester.`,ex:`„haben“ Akkusativ ister. Eril (der Bruder) isimlerde ein → EINEN: Ich habe einen Bruder.`,rule:`Akkusativ: maskulin ein → einen, der → den`,trap:`Akkusativ’de yalnızca eril artikelin değiştiğini unutmak.`},{id:`fe-nach-hause`,q:z,tr:B,o:[`Ich gehe jetzt zu Hause.`,`Ich gehe jetzt nach Hause.`,`Ich bin heute zu Hause.`,`Am Abend bleibe ich zu Hause.`],a:`Ich gehe jetzt zu Hause.`,ex:`Yön (Wohin?) → nach Hause; konum (Wo?) → zu Hause. Ich gehe jetzt NACH Hause.`,rule:`nach Hause (wohin) / zu Hause (wo)`},{id:`fe-in-die-stadt`,q:z,tr:B,o:[`Wir gehen heute Abend ins Kino.`,`Wir sind gestern im Kino gewesen.`,`Morgen fahre ich in der Stadt.`,`Ich arbeite in der Stadt.`],a:`Morgen fahre ich in der Stadt.`,ex:`Şehre GİTMEK bir yön bildirir (Wohin?) → Akkusativ: Morgen fahre ich in DIE Stadt. Şehirde çalışmak ise konumdur (Wo?) → in der Stadt.`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`,d:`A2.2`},{id:`fe-zum-arzt`,q:z,tr:B,o:[`Ich gehe nach dem Arzt.`,`Ich gehe zum Arzt.`,`Ich fahre nach Spanien.`,`Ich gehe zu meiner Freundin.`],a:`Ich gehe nach dem Arzt.`,ex:`Kişilere ve kurumlara gidilirken „zu“ kullanılır: Ich gehe ZUM Arzt. „nach“ şehir/ülke adlarında (nach Spanien) ve „nach Hause“da kullanılır. „nach dem Arzt“ = doktordan sonra.`,rule:`zu (Personen/Orte) vs. nach (Städte/Länder)`,trap:`Türkçe "-e/-a" ekini hep „nach“ ile karşılamak.`},{id:`fe-als-wenn`,q:z,tr:B,o:[`Wenn ich ein Kind war, habe ich in Izmir gewohnt.`,`Als ich ein Kind war, habe ich in Izmir gewohnt.`,`Wenn es regnet, nehme ich den Bus.`,`Als ich nach Hause kam, war niemand da.`],a:`Wenn ich ein Kind war, habe ich in Izmir gewohnt.`,ex:`Geçmişte bir kez olan veya tek bir dönemi anlatan durum için „als“ kullanılır: ALS ich ein Kind war … „wenn“ şimdiki/gelecek zamanda veya geçmişte TEKRARLANAN olaylar için kullanılır.`,rule:`Temporale Nebensätze: als (einmalig, Vergangenheit) / wenn`,d:`A2+`},{id:`fe-komparativ-als`,q:z,tr:B,o:[`Mein Bruder ist größer wie ich.`,`Mein Bruder ist größer als ich.`,`Mein Bruder ist so groß wie ich.`,`Berlin ist größer als München.`],a:`Mein Bruder ist größer wie ich.`,ex:`Karşılaştırma (Komparativ) „als“ ile yapılır: größer ALS ich. Eşitlik ise „so … wie“ ile: so groß wie ich.`,rule:`Komparativ + als / so … wie`},{id:`fe-superlativ`,q:z,tr:B,o:[`Sie singt am bester.`,`Das ist der beste Film.`,`Im Sommer ist es am heißesten.`,`Er läuft am schnellsten.`],a:`Sie singt am bester.`,ex:`Fiili niteleyen üstünlük: am + -sten. gut → besser → AM BESTEN: Sie singt am besten.`,rule:`Superlativ: am …sten`},{id:`fe-reflexiv-fehlt`,q:z,tr:B,o:[`Ich interessiere für Musik.`,`Ich freue mich auf die Ferien.`,`Er wäscht sich jeden Morgen.`,`Wir treffen uns um acht Uhr.`],a:`Ich interessiere für Musik.`,ex:`„sich interessieren für“ dönüşlü bir fiildir; dönüşlü zamir unutulmamalı: Ich interessiere MICH für Musik.`,rule:`Reflexive Verben: sich interessieren, sich freuen`,word:`interessieren`},{id:`fe-reflexiv-person`,q:z,tr:B,o:[`Er erholt dich im Urlaub.`,`Du musst dich beeilen!`,`Ich ruhe mich aus.`,`Wir setzen uns auf die Bank.`],a:`Er erholt dich im Urlaub.`,ex:`Dönüşlü zamir özneye uymalıdır: er → SICH. Er erholt sich im Urlaub. (ich→mich, du→dich, er/sie/es→sich, wir→uns, ihr→euch, sie/Sie→sich)`,rule:`Reflexivpronomen: mich, dich, sich, uns, euch`},{id:`fe-imperativ-du`,q:z,tr:B,o:[`Gibst mir bitte das Salz!`,`Komm bitte schnell!`,`Seid bitte leise!`,`Nehmen Sie bitte Platz!`],a:`Gibst mir bitte das Salz!`,ex:`„du“ emir kipi: çekimli fiilden -st düşer, özne yazılmaz. e→i değişimi korunur: geben → du gibst → GIB! Gib mir bitte das Salz!`,rule:`Imperativ (du / ihr / Sie)`},{id:`fe-adjektiv-dativ`,q:z,tr:B,o:[`Wir wohnen in einem große Haus.`,`Ich trinke gern kalte Milch.`,`Er hat ein neues Auto.`,`Sie trägt einen roten Mantel.`],a:`Wir wohnen in einem große Haus.`,ex:`Dativ’de belirsiz artikelden sonra sıfat -EN alır: in einem GROßEN Haus.`,rule:`Adjektivdeklination nach ein/kein`,d:`A2.2`},{id:`fe-kein-nicht`,q:z,tr:B,o:[`Ich habe nicht Zeit.`,`Ich habe keine Zeit.`,`Das ist nicht mein Buch.`,`Ich komme heute nicht.`],a:`Ich habe nicht Zeit.`,ex:`Artikelsiz veya belirsiz artikelli isim olumsuzlanırken „kein“ kullanılır: Ich habe KEINE Zeit. „nicht“ fiil, sıfat ve belirli isimleri olumsuzlar.`,rule:`Negation: kein vs. nicht`},{id:`fe-bei-seinen-eltern`,q:z,tr:B,o:[`Er wohnt bei seine Eltern.`,`Ich fahre mit meinem Vater nach Berlin.`,`Sie spricht mit ihrer Mutter.`,`Wir helfen unserer Nachbarin.`],a:`Er wohnt bei seine Eltern.`,ex:`„bei“ Dativ ister. Çoğul Dativ’de iyelik zamiri -en, isim de -n alır: bei SEINEN Eltern.`,rule:`Dativpräpositionen: mit, bei, nach, zu, von, aus, seit`},{id:`fe-seit-jahren`,q:z,tr:B,o:[`Ich wohne seit drei Jahre in Köln.`,`Ich wohne seit drei Jahren in Köln.`,`Er lernt seit einem Monat Deutsch.`,`Seit gestern bin ich krank.`],a:`Ich wohne seit drei Jahre in Köln.`,ex:`„seit“ Dativ ister; çoğul Dativ’de isim -n alır: seit drei JAHREN. Ayrıca devam eden durum için Almancada şimdiki zaman kullanılır (Ich wohne …).`,rule:`Dativ Plural: -n`,d:`A2.2`},{id:`fe-partizip-ieren`,q:z,tr:B,o:[`Sie hat Medizin gestudiert.`,`Ich habe in Wien studiert.`,`Wir haben das Zimmer reserviert.`,`Er hat gestern telefoniert.`],a:`Sie hat Medizin gestudiert.`,ex:`-ieren ile biten fiiller Partizip II’de „ge-“ almaz: studieren → studiert, telefonieren → telefoniert.`,rule:`Partizip II: Verben auf -ieren ohne ge-`},{id:`fe-partizip-untrennbar`,q:z,tr:B,o:[`Wir haben die Prüfung gebestanden.`,`Ich habe die Rechnung bezahlt.`,`Hast du die Wohnung besichtigt?`,`Er hat mir nichts erzählt.`],a:`Wir haben die Prüfung gebestanden.`,ex:`Ayrılamayan ön ekli (be-, ver-, er-, ent-, emp-, ge-, zer-) fiiller Partizip II’de „ge-“ almaz: bestehen → BESTANDEN.`,rule:`Partizip II: untrennbare Präfixe ohne ge-`,word:`bestehen`},{id:`fe-w-frage`,q:z,tr:B,o:[`Warum du kommst nicht?`,`Wo wohnst du?`,`Wann fängt der Kurs an?`,`Wie lange dauert die Fahrt?`],a:`Warum du kommst nicht?`,ex:`W-sorularında fiil 2. sıradadır, özne fiilden sonra gelir: Warum KOMMST du nicht?`,rule:`Satzbau: W-Frage (Verb an Position 2)`},{id:`fe-denn-wortstellung`,q:z,tr:B,o:[`Ich bleibe zu Hause, denn ich krank bin.`,`Ich bleibe zu Hause, denn ich bin krank.`,`Ich bleibe zu Hause, weil ich krank bin.`,`Ich bin krank, deshalb bleibe ich zu Hause.`],a:`Ich bleibe zu Hause, denn ich krank bin.`,ex:`„denn“ iki ana cümleyi bağlar (0. pozisyon); kelime sırası değişmez: …, denn ich BIN krank. Fiili sona atan „weil“dir.`,rule:`Konnektoren: denn (Position 0) vs. weil (Verb am Ende)`,trap:`„denn“ ve „weil“ aynı anlama geldiği için kelime sıralarını karıştırmak.`,d:`A2.2`},{id:`fe-trotzdem`,q:z,tr:B,o:[`Er ist krank, trotzdem er geht zur Arbeit.`,`Er ist krank, trotzdem geht er zur Arbeit.`,`Obwohl er krank ist, geht er zur Arbeit.`,`Er geht zur Arbeit, obwohl er krank ist.`],a:`Er ist krank, trotzdem er geht zur Arbeit.`,ex:`„trotzdem“ 1. pozisyonda durur, fiil hemen arkasından gelir: trotzdem GEHT er zur Arbeit.`,rule:`Konnektoren: deshalb/trotzdem + Inversion`,d:`A2.2`},{id:`fe-nebensatz-vorn`,q:z,tr:B,o:[`Wenn ich Zeit habe, ich besuche dich.`,`Wenn ich Zeit habe, besuche ich dich.`,`Ich besuche dich, wenn ich Zeit habe.`,`Wenn du willst, können wir zusammen kochen.`],a:`Wenn ich Zeit habe, ich besuche dich.`,ex:`Yan cümle başta ise 1. pozisyonu o doldurur; ana cümle doğrudan fiille başlar: Wenn ich Zeit habe, BESUCHE ich dich.`,rule:`Satzbau: Nebensatz auf Position 1 → Verb – Subjekt`,d:`A2.2`}]);function Mi(e){return Ai(`prepositions_kasus`,`cloze`,e)}var V=`Boşluğa uygun olanı seçin.`,Ni=Mi([{id:`pk-warten-auf`,q:`Ich warte schon seit zehn Minuten ___ den Bus.`,tr:V,o:[`auf`,`für`,`an`,`zu`],a:`auf`,ex:`warten AUF + Akkusativ. „den Bus“ zaten Akkusativ’dir.`,rule:`Verb + Präposition: warten auf + Akk`,word:`warten`},{id:`pk-mit-der`,q:`Er fährt jeden Tag mit ___ U-Bahn zur Arbeit.`,tr:V,o:[`der`,`die`,`den`,`dem`],a:`der`,ex:`„mit“ + Dativ. die U-Bahn (dişil) → Dativ: DER U-Bahn.`,rule:`Dativpräpositionen: mit, bei, nach, zu, von, aus, seit`},{id:`pk-legen-den`,q:`Ich lege den Schlüssel auf ___ Tisch.`,tr:V,o:[`den`,`dem`,`der`,`des`],a:`den`,ex:`legen = bir yere koymak (Wohin?) → Akkusativ: auf DEN Tisch.`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`},{id:`pk-liegen-dem`,q:`Der Schlüssel liegt auf ___ Tisch.`,tr:V,o:[`dem`,`den`,`der`,`das`],a:`dem`,ex:`liegen = bir yerde durmak (Wo?) → Dativ: auf DEM Tisch.`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`},{id:`pk-ins-kino`,q:`Wir gehen heute Abend ___ Kino.`,tr:V,o:[`ins`,`im`,`in dem`,`ans`],a:`ins`,ex:`Yön (Wohin?) → in + das = INS Kino. „im Kino“ konum bildirir (sinemada).`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`},{id:`pk-an-die-wand`,q:`Sie hängt das Bild an ___ Wand.`,tr:V,o:[`die`,`der`,`den`,`dem`],a:`die`,ex:`hängen (asmak, hareket) → Wohin? → Akkusativ: an DIE Wand.`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`,d:`A2.2`},{id:`pk-an-der-wand`,q:`Das Bild hängt an ___ Wand.`,tr:V,o:[`der`,`die`,`den`,`das`],a:`der`,ex:`hängen (asılı durmak) → Wo? → Dativ: an DER Wand.`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`,d:`A2.2`},{id:`pk-freuen-auf`,q:`Ich freue mich schon ___ die Ferien im Juli.`,tr:V,o:[`auf`,`über`,`für`,`an`],a:`auf`,ex:`Gelecekteki bir şeyi dört gözle beklemek: sich freuen AUF + Akk. Olmuş/var olan bir şeye sevinmek: sich freuen ÜBER + Akk.`,rule:`Verb + Präposition: sich freuen auf / über`,trap:`„auf“ (gelecek) ile „über“ (olmuş şey) ayrımını karıştırmak.`,d:`A2.2`},{id:`pk-danke-fuer`,q:`Vielen Dank ___ das schöne Geschenk!`,tr:V,o:[`für`,`über`,`auf`,`von`],a:`für`,ex:`danken / Dank FÜR + Akkusativ.`,rule:`Verb + Präposition: danken für`},{id:`pk-interessieren-fuer`,q:`Ich interessiere mich sehr ___ Fotografie.`,tr:V,o:[`für`,`an`,`über`,`mit`],a:`für`,ex:`sich interessieren FÜR + Akkusativ.`,rule:`Verb + Präposition: sich interessieren für`,word:`interessieren`},{id:`pk-nach-der-arbeit`,q:`Nach ___ Arbeit gehe ich oft ins Fitnessstudio.`,tr:V,o:[`der`,`die`,`dem`,`den`],a:`der`,ex:`„nach“ Dativ ister: die Arbeit → nach DER Arbeit.`,rule:`Dativpräpositionen: mit, bei, nach, zu, von, aus, seit`},{id:`pk-zum-arzt`,q:`Ich habe Zahnschmerzen und gehe heute ___ Zahnarzt.`,tr:V,o:[`zum`,`zur`,`nach`,`beim`],a:`zum`,ex:`Kişiye gitmek: zu + Dativ. der Zahnarzt → zu dem = ZUM Zahnarzt. (beim = doktorda, konum)`,rule:`zu (Personen/Orte) vs. nach (Städte/Länder)`},{id:`pk-nach-oesterreich`,q:`Am Wochenende fahren wir ___ Österreich.`,tr:V,o:[`nach`,`in`,`zu`,`an`],a:`nach`,ex:`Artikelsiz ülke ve şehir adlarına gidilirken „nach“ kullanılır: nach Österreich, nach Berlin.`,rule:`zu (Personen/Orte) vs. nach (Städte/Länder)`},{id:`pk-in-die-tuerkei`,q:`Im Sommer fliegen wir ___ Türkei.`,tr:V,o:[`in die`,`nach`,`zur`,`in der`],a:`in die`,ex:`Artikelli ülkeler (die Türkei, die Schweiz, die USA) için „in + Akkusativ“: IN DIE Türkei.`,rule:`Länder mit Artikel: in die Türkei / in der Türkei`,trap:`Bütün ülkelerde „nach“ kullanmak.`,d:`A2.2`},{id:`pk-im-supermarkt`,q:`Ich kann gerade nicht telefonieren, ich bin ___ Supermarkt.`,tr:V,o:[`im`,`in den`,`zum`,`ins`],a:`im`,ex:`Konum (Wo?) → in + Dativ: in dem = IM Supermarkt.`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`},{id:`pk-helfen-mir`,q:`Kannst du ___ helfen? Die Tasche ist so schwer.`,tr:V,o:[`mir`,`mich`,`ich`,`meiner`],a:`mir`,ex:`helfen + Dativ: ich → MIR.`,rule:`Verben mit Dativ: helfen, danken, gefallen, gehören`,word:`helfen`},{id:`pk-schenken-dativ`,q:`Ich habe ___ Bruder ein Buch geschenkt.`,tr:V,o:[`meinem`,`meinen`,`mein`,`meiner`],a:`meinem`,ex:`schenken: Kime? → Dativ (kişi), Ne? → Akkusativ (şey). der Bruder → MEINEM Bruder.`,rule:`Dativ + Akkusativ: jemandem etwas geben/schenken`,d:`A2.2`},{id:`pk-sprechen-ueber`,q:`Wir sprechen oft ___ unsere Pläne für die Zukunft.`,tr:V,o:[`über`,`von`,`an`,`für`],a:`über`,ex:`sprechen ÜBER + Akkusativ (bir konu hakkında konuşmak).`,rule:`Verb + Präposition: sprechen über`},{id:`pk-traeumen-von`,q:`Er träumt ___ einem eigenen Haus mit Garten.`,tr:V,o:[`von`,`über`,`auf`,`an`],a:`von`,ex:`träumen VON + Dativ: von einem eigenen Haus.`,rule:`Verb + Präposition: träumen von`,d:`A2.2`},{id:`pk-denken-an`,q:`Ich denke oft ___ meine Familie in der Türkei.`,tr:V,o:[`an`,`auf`,`über`,`von`],a:`an`,ex:`denken AN + Akkusativ (birini/bir şeyi düşünmek).`,rule:`Verb + Präposition: denken an`},{id:`pk-ohne-akk`,q:`Ohne ___ Brille kann ich nichts sehen.`,tr:V,o:[`meine`,`meiner`,`meinem`,`mein`],a:`meine`,ex:`„ohne“ Akkusativ ister (für, ohne, gegen, durch, um). die Brille → ohne MEINE Brille.`,rule:`Akkusativpräpositionen: für, ohne, gegen, durch, um`},{id:`pk-seit-einer-woche`,q:`Seit ___ Woche lerne ich jeden Tag Vokabeln.`,tr:V,o:[`einer`,`eine`,`einem`,`einen`],a:`einer`,ex:`„seit“ + Dativ. die Woche → seit EINER Woche.`,rule:`Dativpräpositionen: mit, bei, nach, zu, von, aus, seit`},{id:`pk-gegenueber`,q:`Die Apotheke ist gegenüber ___ Bahnhof.`,tr:V,o:[`dem`,`den`,`der`,`des`],a:`dem`,ex:`„gegenüber“ Dativ ister: der Bahnhof → gegenüber DEM Bahnhof.`,rule:`Dativpräpositionen: mit, bei, nach, zu, von, aus, seit`,d:`A2.2`},{id:`pk-stellen-in-den`,q:`Stell die Flaschen bitte in ___ Kühlschrank.`,tr:V,o:[`den`,`dem`,`der`,`das`],a:`den`,ex:`stellen (koymak, hareket) → Wohin? → Akkusativ: in DEN Kühlschrank.`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`},{id:`pk-zwischen`,q:`Zwischen ___ Bank und ___ Post ist ein kleines Café.`,tr:V,o:[`der … der`,`die … die`,`den … den`,`dem … dem`],a:`der … der`,ex:`Konum (Wo?) → zwischen + Dativ. die Bank, die Post → zwischen DER Bank und DER Post.`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`,d:`A2.2`},{id:`pk-bei-diesem`,q:`Bei ___ Wetter bleiben wir lieber zu Hause.`,tr:V,o:[`diesem`,`diesen`,`dieser`,`dieses`],a:`diesem`,ex:`„bei“ + Dativ. das Wetter → bei DIESEM Wetter.`,rule:`Dativpräpositionen: mit, bei, nach, zu, von, aus, seit`},{id:`pk-besuchen-akk`,q:`Ich besuche morgen ___ Großvater im Krankenhaus.`,tr:V,o:[`meinen`,`meinem`,`mein`,`meiner`],a:`meinen`,ex:`„besuchen“ Akkusativ nesne alır. der Großvater → MEINEN Großvater.`,rule:`Akkusativ: maskulin ein → einen, der → den`},{id:`pk-gehoeren`,q:`Das Auto gehört ___ Chef.`,tr:V,o:[`dem`,`den`,`der`,`das`],a:`dem`,ex:`„gehören“ Dativ ister: der Chef → DEM Chef.`,rule:`Verben mit Dativ: helfen, danken, gefallen, gehören`},{id:`pk-von-bis`,q:`Ich bin ___ Montag bis Freitag im Büro.`,tr:V,o:[`von`,`ab`,`seit`,`aus`],a:`von`,ex:`Zaman aralığı: VON … BIS … (Pazartesiden cumaya kadar).`,rule:`Temporale Präpositionen: um, am, im, von … bis`},{id:`pk-um-uhr`,q:`Der Kurs beginnt ___ 9 Uhr.`,tr:V,o:[`um`,`am`,`im`,`an`],a:`um`,ex:`Saat: UM 9 Uhr. Gün: AM Montag. Ay/mevsim: IM Juli / im Sommer.`,rule:`Temporale Präpositionen: um, am, im, von … bis`},{id:`pk-am-samstag`,q:`Wir treffen uns ___ Samstag vor dem Kino.`,tr:V,o:[`am`,`um`,`im`,`in`],a:`am`,ex:`Günler ve tarihler: AM Samstag, am 3. Mai.`,rule:`Temporale Präpositionen: um, am, im, von … bis`},{id:`pk-im-juli`,q:`Ich habe ___ Juli Geburtstag.`,tr:V,o:[`im`,`am`,`um`,`in`],a:`im`,ex:`Aylar ve mevsimler: IM Juli, im Winter.`,rule:`Temporale Präpositionen: um, am, im, von … bis`},{id:`pk-an-der-haltestelle`,q:`Sie wartet ___ der Haltestelle auf den Bus.`,tr:V,o:[`an`,`auf`,`bei`,`in`],a:`an`,ex:`Durak, kapı, pencere gibi bir şeyin "kenarında/yanında": AN der Haltestelle (Dativ, konum).`,rule:`Wechselpräpositionen: wohin → Akkusativ, wo → Dativ`}]);function Pi(e){return Ai(`grammar`,`multiple_choice`,e)}var Fi=Pi([{id:`gk-weil`,q:`Ich lerne Deutsch, ___ ich in Deutschland arbeiten möchte.`,tr:V,o:[`weil`,`deshalb`,`denn`,`trotzdem`],a:`weil`,ex:`Fiil (möchte) sonda → yan cümle bağlacı gerekir: WEIL. „denn“ seçilseydi fiil 2. sırada olurdu (denn ich möchte …).`,rule:`Nebensatz: weil + Verb am Ende`},{id:`gk-deshalb`,q:`Ich möchte in Deutschland arbeiten, ___ lerne ich Deutsch.`,tr:V,o:[`deshalb`,`weil`,`obwohl`,`dass`],a:`deshalb`,ex:`Boşluktan sonra fiil (lerne) geliyor → bağlaç 1. pozisyonu dolduran bir zarf olmalı: DESHALB lerne ich …`,rule:`Konnektoren: deshalb/trotzdem + Inversion`},{id:`gk-obwohl`,q:`___ es kalt ist, trägt er nur ein T-Shirt.`,tr:V,o:[`Obwohl`,`Weil`,`Deshalb`,`Trotzdem`],a:`Obwohl`,ex:`Beklenenin tersi (soğuk ama tişört) → karşıtlık; fiil sonda → OBWOHL.`,rule:`Konnektoren: obwohl (keine Doppelkonjunktion)`,d:`A2.2`},{id:`gk-trotzdem`,q:`Es ist sehr kalt. ___ trägt er nur ein T-Shirt.`,tr:V,o:[`Trotzdem`,`Obwohl`,`Weil`,`Wenn`],a:`Trotzdem`,ex:`Ayrı cümlede karşıtlık + fiil hemen sonra → TROTZDEM (yine de).`,rule:`Konnektoren: deshalb/trotzdem + Inversion`,d:`A2.2`},{id:`gk-dass`,q:`Ich hoffe, ___ du bald wieder gesund bist.`,tr:V,o:[`dass`,`das`,`weil`,`ob`],a:`dass`,ex:`hoffen, glauben, denken, wissen, sagen fiillerinden sonra içerik cümlesi: DASS + fiil sonda. („das“ artikel/ilgi zamiridir.)`,rule:`Nebensatz: dass + Verb am Ende`,trap:`„das“ ile „dass“ı karıştırmak.`},{id:`gk-wenn`,q:`___ du Zeit hast, ruf mich bitte an.`,tr:V,o:[`Wenn`,`Als`,`Ob`,`Dass`],a:`Wenn`,ex:`Koşul (eğer … -rsan): WENN.`,rule:`Konnektoren: wenn (Bedingung)`},{id:`gk-ob`,q:`Weißt du, ___ der Supermarkt heute geöffnet hat?`,tr:V,o:[`ob`,`dass`,`wenn`,`weil`],a:`ob`,ex:`Dolaylı evet/hayır sorusu → OB (… -ip -mediğini).`,rule:`Indirekte Frage: ob`,d:`A2+`},{id:`gk-sondern`,q:`Ich trinke keinen Kaffee, ___ ich trinke Tee.`,tr:V,o:[`sondern`,`aber`,`oder`,`denn`],a:`sondern`,ex:`Olumsuzdan (kein/nicht) sonra düzeltme: SONDERN (… değil, bilakis …).`,rule:`Konnektoren: aber vs. sondern`,d:`A2.2`},{id:`gk-denn`,q:`Ich komme heute nicht mit, ___ ich habe keine Zeit.`,tr:V,o:[`denn`,`weil`,`deshalb`,`obwohl`],a:`denn`,ex:`Boşluktan sonra normal sıra (ich habe): DENN. „weil“ olsaydı fiil sona giderdi.`,rule:`Konnektoren: denn (Position 0) vs. weil (Verb am Ende)`},{id:`gk-oder`,q:`Wir können ins Kino gehen ___ zu Hause einen Film sehen.`,tr:V,o:[`oder`,`sondern`,`aber`,`denn`],a:`oder`,ex:`İki seçenek: ODER (veya).`,rule:`Konnektoren: und, oder, aber`},{id:`gk-perfekt-gehen`,q:`Wir ___ gestern ins Theater gegangen.`,tr:V,o:[`sind`,`haben`,`waren`,`werden`],a:`sind`,ex:`gehen (hareket) → Perfekt „sein“ ile: wir SIND gegangen.`,rule:`Perfekt: Bewegungsverben mit sein`},{id:`gk-perfekt-schlafen`,q:`Ich ___ heute Morgen sehr lange geschlafen.`,tr:V,o:[`habe`,`bin`,`war`,`hatte`],a:`habe`,ex:`schlafen yer/durum değişikliği bildirmez → „haben“: ich HABE geschlafen.`,rule:`Perfekt: haben oder sein?`},{id:`gk-perfekt-passieren`,q:`Was ___ denn passiert? – Ein Unfall auf der Kreuzung!`,tr:V,o:[`ist`,`hat`,`sind`,`wird`],a:`ist`,ex:`„passieren“ (olmak, meydana gelmek) Perfekt’te „sein“ alır: Was IST passiert?`,rule:`Perfekt: haben oder sein?`,d:`A2.2`},{id:`gk-perfekt-bleiben`,q:`Er ___ den ganzen Tag zu Hause geblieben.`,tr:V,o:[`ist`,`hat`,`war`,`wird`],a:`ist`,ex:`„bleiben“ hareket etmese de istisnai olarak „sein“ alır: er IST geblieben. (sein, werden, bleiben → sein)`,rule:`Perfekt: haben oder sein?`,trap:`Hareket olmadığı için „haben“ seçmek.`,d:`A2.2`},{id:`gk-partizip-besuchen`,q:`Gestern habe ich meine Oma ___.`,tr:V,o:[`besucht`,`gebesucht`,`besuchen`,`besuchte`],a:`besucht`,ex:`be- ön eki ayrılamaz → Partizip II’de ge- yok: BESUCHT.`,rule:`Partizip II: untrennbare Präfixe ohne ge-`,word:`besuchen`},{id:`gk-partizip-aufstehen`,q:`Wann bist du heute ___?`,tr:V,o:[`aufgestanden`,`aufgesteht`,`geaufstanden`,`aufstehen`],a:`aufgestanden`,ex:`Ayrılabilen fiillerde „ge-“ ön ek ile kök arasına girer: auf-GE-standen. stehen düzensizdir: gestanden.`,rule:`Partizip II: trennbare Verben (auf-ge-…)`,word:`aufstehen`},{id:`gk-praet-konnte`,q:`Gestern ___ ich leider nicht kommen, ich war krank.`,tr:V,o:[`konnte`,`kann`,`könnte`,`gekonnt`],a:`konnte`,ex:`Geçmişte modal fiil genellikle Präteritum’la kullanılır: können → ich KONNTE.`,rule:`Modalverben im Präteritum`,d:`A2.2`},{id:`gk-praet-musste`,q:`Als Kind ___ ich jeden Abend um acht Uhr ins Bett gehen.`,tr:V,o:[`musste`,`muss`,`müsste`,`musst`],a:`musste`,ex:`müssen → Präteritum: ich MUSSTE (umlaut düşer).`,rule:`Modalverben im Präteritum`,trap:`„müsste“ (Konjunktiv II, -meli olurdu) ile „musste“ (-mek zorundaydı) karıştırılır.`,d:`A2.2`},{id:`gk-praet-durften`,q:`Früher ___ wir im Unterricht kein Handy benutzen.`,tr:V,o:[`durften`,`dürfen`,`durfte`,`dürften`],a:`durften`,ex:`dürfen → Präteritum: wir DURFTEN (umlaut düşer, çoğul eki -en).`,rule:`Modalverben im Präteritum`,d:`A2.2`},{id:`gk-praet-wollte`,q:`Mein Bruder ___ als Kind immer Pilot werden.`,tr:V,o:[`wollte`,`will`,`wolltet`,`gewollt`],a:`wollte`,ex:`wollen → er WOLLTE.`,rule:`Modalverben im Präteritum`},{id:`gk-praet-solltet`,q:`Ihr ___ doch gestern anrufen! Warum habt ihr das nicht gemacht?`,tr:V,o:[`solltet`,`sollt`,`sollten`,`solltest`],a:`solltet`,ex:`sollen → Präteritum ihr-çekimi: ihr SOLLTET.`,rule:`Modalverben im Präteritum`,d:`A2+`},{id:`gk-praet-war`,q:`Letztes Jahr ___ ich drei Wochen in Spanien.`,tr:V,o:[`war`,`bin`,`wäre`,`hatte`],a:`war`,ex:`„sein“ geçmişte genellikle Präteritum’la kullanılır: ich WAR.`,rule:`Präteritum: sein und haben`},{id:`gk-praet-hatten`,q:`Gestern ___ wir leider keine Zeit.`,tr:V,o:[`hatten`,`haben`,`hätten`,`waren`],a:`hatten`,ex:`„haben“ → Präteritum: wir HATTEN.`,rule:`Präteritum: sein und haben`},{id:`gk-komparativ-schneller`,q:`Der Zug ist ___ als der Bus.`,tr:V,o:[`schneller`,`am schnellsten`,`mehr schnell`,`schnell`],a:`schneller`,ex:`Karşılaştırma: sıfat + -er + als → SCHNELLER als.`,rule:`Komparativ + als / so … wie`},{id:`gk-lieber`,q:`Ich trinke ___ Tee als Kaffee.`,tr:V,o:[`lieber`,`gerner`,`mehr gern`,`am liebsten`],a:`lieber`,ex:`gern → LIEBER → am liebsten (düzensiz).`,rule:`Komparativ: gern – lieber – am liebsten`},{id:`gk-superlativ-beste`,q:`Das ist das ___ Restaurant in der Stadt.`,tr:V,o:[`beste`,`besser`,`gut`,`am besten`],a:`beste`,ex:`İsim önünde üstünlük: das BESTE Restaurant. „am besten“ fiil/yüklem ile kullanılır.`,rule:`Superlativ: am …sten`,d:`A2.2`},{id:`gk-komparativ-kaelter`,q:`Im Winter ist es hier viel ___ als im Sommer.`,tr:V,o:[`kälter`,`kalter`,`kältest`,`am kältesten`],a:`kälter`,ex:`Tek heceli bazı sıfatlar karşılaştırmada umlaut alır: kalt → KÄLTER (alt→älter, groß→größer, jung→jünger).`,rule:`Komparativ + als / so … wie`},{id:`gk-k2-koennten`,q:`___ Sie mir bitte sagen, wie spät es ist?`,tr:`Kibar rica için en uygun olanı seçin.`,o:[`Könnten`,`Konnten`,`Kannst`,`Gekonnt`],a:`Könnten`,ex:`Kibar rica: Konjunktiv II → KÖNNTEN Sie …? („Konnten“ geçmiş zamandır.)`,rule:`Konjunktiv II: höfliche Bitte (könnten, würden, hätte gern)`,d:`A2.2`},{id:`gk-k2-haette`,q:`Guten Tag, ich ___ gern ein Kilo Tomaten.`,tr:`Kibar sipariş için en uygun olanı seçin.`,o:[`hätte`,`hatte`,`habe gehabt`,`hättest`],a:`hätte`,ex:`Alışverişte/kafede kibar istek: Ich HÄTTE gern … (= Ich möchte …).`,rule:`Konjunktiv II: höfliche Bitte (könnten, würden, hätte gern)`},{id:`gk-k2-wuerde`,q:`An deiner Stelle ___ ich sofort zum Arzt gehen.`,tr:`Tavsiye için en uygun olanı seçin.`,o:[`würde`,`wurde`,`werde`,`wird`],a:`würde`,ex:`Tavsiye: An deiner Stelle WÜRDE ich … (Senin yerinde olsam …).`,rule:`Konjunktiv II: Ratschlag (würde, sollte)`,d:`A2+`},{id:`gk-adj-guenstige`,q:`Wir suchen eine ___ Wohnung in der Nähe vom Bahnhof.`,tr:V,o:[`günstige`,`günstigen`,`günstiger`,`günstig`],a:`günstige`,ex:`eine + dişil Akkusativ → sıfat -E: eine günstigE Wohnung.`,rule:`Adjektivdeklination nach ein/kein`,d:`A2.2`},{id:`gk-adj-blauen`,q:`Er trägt heute einen ___ Pullover.`,tr:V,o:[`blauen`,`blaue`,`blauer`,`blaues`],a:`blauen`,ex:`einen + eril Akkusativ → sıfat -EN: einen blauEN Pullover.`,rule:`Adjektivdeklination nach ein/kein`,d:`A2.2`},{id:`gk-adj-neuen`,q:`Mit dem ___ Auto fahren wir in den Urlaub.`,tr:V,o:[`neuen`,`neue`,`neuem`,`neues`],a:`neuen`,ex:`Belirli artikelden sonra Dativ’de sıfat her zaman -EN alır: mit dem neuEN Auto.`,rule:`Adjektivdeklination nach der/die/das`,d:`A2.2`},{id:`gk-adj-interessantes`,q:`Das ist ein sehr ___ Buch.`,tr:V,o:[`interessantes`,`interessanter`,`interessante`,`interessanten`],a:`interessantes`,ex:`ein + nötr (das Buch) Nominativ → sıfat -ES: ein interessantES Buch.`,rule:`Adjektivdeklination nach ein/kein`,d:`A2.2`},{id:`gk-refl-uns`,q:`Wir müssen ___ beeilen, der Zug fährt gleich ab.`,tr:V,o:[`uns`,`euch`,`sich`,`wir`],a:`uns`,ex:`sich beeilen: wir → UNS.`,rule:`Reflexivpronomen: mich, dich, sich, uns, euch`},{id:`gk-refl-dich`,q:`Hast du ___ schon für den Kurs angemeldet?`,tr:V,o:[`dich`,`dir`,`sich`,`du`],a:`dich`,ex:`sich anmelden: du → DICH (Akkusativ).`,rule:`Reflexivpronomen: mich, dich, sich, uns, euch`},{id:`gk-imp-mach`,q:`___ bitte das Fenster zu, es ist kalt! (du)`,tr:V,o:[`Mach`,`Machst`,`Machen`,`Macht du`],a:`Mach`,ex:`du-emir kipi: kök + (e): MACH … zu! (zumachen ayrılabilen fiil)`,rule:`Imperativ (du / ihr / Sie)`},{id:`gk-imp-sie`,q:`___ Sie bitte hier unten! (Formular)`,tr:V,o:[`Unterschreiben`,`Unterschreib`,`Unterschreibt`,`Unterschreibst`],a:`Unterschreiben`,ex:`Sie-emir kipi: mastar + Sie: UNTERSCHREIBEN Sie!`,rule:`Imperativ (du / ihr / Sie)`},{id:`gk-pron-ihm`,q:`Mein Vater hat Geburtstag. Ich schenke ___ eine Uhr.`,tr:V,o:[`ihm`,`ihn`,`er`,`sein`],a:`ihm`,ex:`schenken: kişi Dativ’dedir → er → IHM.`,rule:`Personalpronomen im Dativ: mir, dir, ihm, ihr, uns, euch, ihnen`,d:`A2.2`},{id:`gk-trennbar-an`,q:`Wann fängt der Film ___?`,tr:V,o:[`an`,`auf`,`ab`,`aus`],a:`an`,ex:`anfangen ayrılabilen fiildir: Wann fängt der Film AN?`,rule:`Trennbare Verben: Präfix am Satzende`,word:`anfangen`},{id:`gk-trennbar-nebensatz`,q:`Weißt du, wann der Zug in Köln ___?`,tr:V,o:[`ankommt`,`kommt an`,`an kommt`,`ankommen`],a:`ankommt`,ex:`Yan cümlede ayrılabilen fiil BİTİŞİK olarak sona gider: …, wann der Zug ANKOMMT.`,rule:`Trennbare Verben im Nebensatz`,d:`A2+`},{id:`gk-zu-infinitiv`,q:`Hast du Lust, heute Abend ins Kino ___?`,tr:V,o:[`zu gehen`,`gehen`,`gehst`,`zu gehst`],a:`zu gehen`,ex:`„Lust haben“, „Zeit haben“, „vergessen“ gibi ifadelerden sonra zu + mastar: Hast du Lust, … ZU GEHEN?`,rule:`Infinitiv mit zu`,d:`A2+`},{id:`gk-werden`,q:`Meine Schwester möchte später Ärztin ___.`,tr:V,o:[`werden`,`wird`,`worden`,`wurde`],a:`werden`,ex:`Modal fiil (möchte) + mastar sonda: WERDEN (olmak, meslek sahibi olmak).`,rule:`Modalverben: Infinitiv am Satzende`},{id:`gk-possessiv-ihr`,q:`Entschuldigung, Herr Schmidt, ist das ___ Koffer?`,tr:V,o:[`Ihr`,`dein`,`euer`,`unser`],a:`Ihr`,ex:`Resmî hitap (Sie) → iyelik zamiri büyük harfle IHR.`,rule:`Possessivartikel (formell: Ihr)`},{id:`gk-kein-akk`,q:`Tut mir leid, ich habe ___ Auto.`,tr:V,o:[`kein`,`keinen`,`keine`,`nicht`],a:`kein`,ex:`das Auto (nötr) Akkusativ → KEIN Auto. (Eril olsaydı: keinen Wagen)`,rule:`Negation: kein vs. nicht`}]);function Ii(e){return Ai(`dialogue`,`dialogue_completion`,e)}var Li=`Diyaloğu en uygun cevapla tamamlayın.`,Ri=Ii([{id:`dl-arzt`,q:`Beim Arzt: „Was fehlt Ihnen denn?“ – „___“`,tr:Li,o:[`Ich habe seit gestern Kopfschmerzen und Fieber.`,`Ich hätte gern ein Kilo Äpfel.`,`Ja, Sie fehlen mir sehr.`,`Der Zug fährt um acht Uhr ab.`],a:`Ich habe seit gestern Kopfschmerzen und Fieber.`,ex:`„Was fehlt Ihnen?“ doktorun kalıp sorusudur: "Şikâyetiniz ne?" Cevap rahatsızlığı anlatır.`,rule:`Situation: beim Arzt`,trap:`„fehlen“ fiilini "özlemek" anlamıyla karıştırmak (Du fehlst mir = Seni özlüyorum).`},{id:`dl-gleis`,q:`Am Bahnhof: „Entschuldigung, von welchem Gleis fährt der Zug nach Hamburg?“ – „___“`,tr:Li,o:[`Von Gleis 7, in zehn Minuten.`,`Mit dem Zug, bitte.`,`Hamburg liegt im Norden.`,`Ich fahre nicht gern Zug.`],a:`Von Gleis 7, in zehn Minuten.`,ex:`Soru peronu (Gleis) soruyor; cevap peron numarasını vermeli.`,rule:`Situation: am Bahnhof`},{id:`dl-bestellen`,q:`Im Restaurant: Kellner: „Was darf ich Ihnen bringen?“ – Gast: „___“`,tr:Li,o:[`Ich hätte gern eine Gemüsesuppe und ein Wasser.`,`Ich bringe Ihnen gern die Suppe.`,`Ja, das dürfen Sie.`,`Die Rechnung war zu teuer.`],a:`Ich hätte gern eine Gemüsesuppe und ein Wasser.`,ex:`Sipariş verirken: Ich hätte gern … / Ich nehme … / Für mich bitte …`,rule:`Situation: im Restaurant`},{id:`dl-zahlen`,q:`Im Restaurant: Gast: „Wir möchten bitte zahlen.“ – Kellner: „___“`,tr:Li,o:[`Zusammen oder getrennt?`,`Guten Appetit!`,`Ich hätte gern die Speisekarte.`,`Nein, danke, ich bin satt.`],a:`Zusammen oder getrennt?`,ex:`Almanya’da garson hesabı birlikte mi ayrı mı ödeyeceğinizi sorar: Zusammen oder getrennt?`,rule:`Situation: im Restaurant`},{id:`dl-wohnung`,q:`„Guten Tag, ich habe Ihre Anzeige gelesen. Ist die Wohnung noch frei?“ – „___“`,tr:Li,o:[`Ja, Sie können sie am Mittwoch besichtigen.`,`Ja, ich habe auch eine Anzeige.`,`Nein, ich lese keine Zeitung.`,`Die Wohnung hat mir gut gefallen.`],a:`Ja, Sie können sie am Mittwoch besichtigen.`,ex:`Ev ilanına cevap: ev boşsa görme randevusu (besichtigen) önerilir.`,rule:`Situation: Wohnungssuche`},{id:`dl-praxis`,q:`Am Telefon: „Praxis Dr. Weber, guten Tag.“ – „___“`,tr:Li,o:[`Guten Tag, hier ist Müller. Ich möchte gern einen Termin machen.`,`Auf Wiederhören!`,`Ich bin Arzt von Beruf.`,`Danke, mir geht es auch gut.`],a:`Guten Tag, hier ist Müller. Ich möchte gern einen Termin machen.`,ex:`Telefonda önce kendinizi tanıtın (Hier ist …), sonra amacınızı söyleyin.`,rule:`Situation: Telefonieren / Termin`},{id:`dl-party-zusage`,q:`„Hast du am Samstag Zeit? Ich mache eine Party.“ – „___“`,tr:Li,o:[`Gern! Wann soll ich kommen?`,`Ja, ich habe am Samstag Geburtstag gehabt.`,`Nein, ich mache keine Hausaufgaben.`,`Die Party war super.`],a:`Gern! Wann soll ich kommen?`,ex:`Davete olumlu cevap ve ayrıntı sorusu: Gern! Wann/Wo …?`,rule:`Situation: Einladung annehmen/absagen`},{id:`dl-absage`,q:`„Kommst du morgen zum Fußballtraining?“ – „___“`,tr:Li,o:[`Leider nicht, ich muss für meine Prüfung lernen.`,`Ja, gestern war das Training toll.`,`Fußball ist ein Sport.`,`Nein, das Training kommt nicht.`],a:`Leider nicht, ich muss für meine Prüfung lernen.`,ex:`Nazikçe reddetme: Leider nicht, … + gerekçe.`,rule:`Situation: Einladung annehmen/absagen`},{id:`dl-verkaeuferin`,q:`Verkäuferin: „Kann ich Ihnen helfen?“ – Kundin: „___“`,tr:Li,o:[`Ja, ich suche einen Pullover in Größe M.`,`Ja, ich helfe Ihnen gern.`,`Nein, ich kann nicht helfen.`,`Danke, der Pullover hat 30 Euro gekostet.`],a:`Ja, ich suche einen Pullover in Größe M.`,ex:`Mağazada yardım teklifine cevap: Ja, ich suche … / Nein danke, ich schaue nur.`,rule:`Situation: Einkaufen`},{id:`dl-anprobieren`,q:`Kundin: „Kann ich die Hose anprobieren?“ – Verkäuferin: „___“`,tr:Li,o:[`Natürlich, die Umkleidekabine ist dort hinten.`,`Nein, die Hose ist blau.`,`Ja, ich probiere sie gern.`,`Die Kasse ist geschlossen.`],a:`Natürlich, die Umkleidekabine ist dort hinten.`,ex:`anprobieren = denemek (kıyafet). Cevap deneme kabinini (Umkleidekabine) gösterir.`,rule:`Situation: Einkaufen`},{id:`dl-weg`,q:`„Entschuldigung, wie komme ich zum Rathaus?“ – „___“`,tr:Li,o:[`Gehen Sie geradeaus und dann die zweite Straße links.`,`Das Rathaus ist sehr alt und schön.`,`Ich komme mit dem Bus.`,`Ja, ich kenne das Rathaus.`],a:`Gehen Sie geradeaus und dann die zweite Straße links.`,ex:`Yol tarifi: geradeaus (düz), links/rechts, die zweite Straße, an der Ampel …`,rule:`Situation: Wegbeschreibung`},{id:`dl-hotel`,q:`An der Rezeption: „Wie lange möchten Sie bleiben?“ – „___“`,tr:Li,o:[`Drei Nächte, bis Freitag.`,`Ein Einzelzimmer, bitte.`,`Mit Frühstück, bitte.`,`Ich bleibe gern hier.`],a:`Drei Nächte, bis Freitag.`,ex:`„Wie lange?“ süre sorar → Drei Nächte / bis Freitag.`,rule:`Situation: im Hotel`},{id:`dl-anmeldung`,q:`Auf dem Bürgeramt: „Was brauche ich für die Anmeldung?“ – „___“`,tr:Li,o:[`Ihren Ausweis und die Bestätigung vom Vermieter.`,`Die Anmeldung ist im zweiten Stock.`,`Sie haben sich schon angemeldet.`,`Ich brauche nichts, danke.`],a:`Ihren Ausweis und die Bestätigung vom Vermieter.`,ex:`Soru gerekli belgeleri soruyor → belge sayılmalı.`,rule:`Situation: Ämter und Behörden`},{id:`dl-chefin`,q:`Chefin: „Können Sie morgen etwas länger bleiben?“ – „___“`,tr:Li,o:[`Morgen leider nicht, aber am Donnerstag geht es.`,`Ja, ich bin gestern länger geblieben.`,`Nein, ich bin nicht lang.`,`Ich bleibe nicht in der Firma, ich bleibe im Büro.`],a:`Morgen leider nicht, aber am Donnerstag geht es.`,ex:`Reddedip alternatif önermek iş hayatında kibar bir cevaptır.`,rule:`Situation: am Arbeitsplatz`},{id:`dl-verspaetung`,q:`„Entschuldigung, dass ich zu spät komme. Mein Bus hatte Verspätung.“ – „___“`,tr:Li,o:[`Kein Problem. Wir haben gerade erst angefangen.`,`Gute Reise!`,`Herzlichen Glückwunsch!`,`Ja, der Bus ist immer pünktlich.`],a:`Kein Problem. Wir haben gerade erst angefangen.`,ex:`Özre verilen kalıp cevaplar: Kein Problem. / Macht nichts. / Schon gut.`,rule:`Redemittel: sich entschuldigen / reagieren`},{id:`dl-glueckwunsch`,q:`„Ich habe meine Prüfung bestanden!“ – „___“`,tr:Li,o:[`Super! Herzlichen Glückwunsch!`,`Gute Besserung!`,`Das tut mir leid.`,`Viel Glück bei der Prüfung!`],a:`Super! Herzlichen Glückwunsch!`,ex:`Başarıyı kutlamak: Herzlichen Glückwunsch! (Viel Glück = sınavdan ÖNCE iyi şanslar)`,rule:`Redemittel: gratulieren / Wünsche`},{id:`dl-besserung`,q:`„Ich bin seit drei Tagen erkältet.“ – „___“`,tr:Li,o:[`Oh, gute Besserung!`,`Herzlichen Glückwunsch!`,`Guten Appetit!`,`Schöne Ferien!`],a:`Oh, gute Besserung!`,ex:`Hasta birine: Gute Besserung! (Geçmiş olsun)`,rule:`Redemittel: gratulieren / Wünsche`},{id:`dl-meinung`,q:`„Wie findest du den neuen Film?“ – „___“`,tr:Li,o:[`Ich finde ihn ziemlich langweilig.`,`Ich habe ihn im Kino gefunden.`,`Er beginnt um 20 Uhr.`,`Ich finde das Kino nicht.`],a:`Ich finde ihn ziemlich langweilig.`,ex:`„Wie findest du …?“ fikir sorar (bulmak değil!). Cevap: Ich finde ihn/sie/es + sıfat.`,rule:`Redemittel: Meinung äußern`,trap:`„finden“i yalnızca "bulmak" anlamıyla düşünmek.`},{id:`dl-fahrkarte`,q:`Am Schalter: „Eine Fahrkarte nach Köln, bitte.“ – „___“`,tr:Li,o:[`Einfach oder hin und zurück?`,`Köln ist sehr schön.`,`Gute Fahrt gehabt?`,`Ich fahre auch nach Köln.`],a:`Einfach oder hin und zurück?`,ex:`Bilet alırken sorulan kalıp: Einfach (tek yön) oder hin und zurück (gidiş-dönüş)?`,rule:`Situation: am Bahnhof`},{id:`dl-termin-verschieben`,q:`„Können wir den Termin auf nächste Woche verschieben?“ – „___“`,tr:Li,o:[`Ja, passt Ihnen Dienstag um 10 Uhr?`,`Ja, der Termin war letzte Woche.`,`Nein, ich habe keinen Termin gemacht.`,`Danke, ich verschiebe den Tisch.`],a:`Ja, passt Ihnen Dienstag um 10 Uhr?`,ex:`verschieben = ertelemek. Uygun cevap yeni bir zaman önerir: Passt Ihnen …?`,rule:`Situation: Telefonieren / Termin`},{id:`dl-nachbar`,q:`„Könnten Sie in meinem Urlaub meine Blumen gießen?“ – „___“`,tr:Li,o:[`Ja, gern. Geben Sie mir einfach den Schlüssel.`,`Ja, ich mache auch Urlaub.`,`Die Blumen sind sehr schön.`,`Nein, ich habe keine Blumen gekauft.`],a:`Ja, gern. Geben Sie mir einfach den Schlüssel.`,ex:`Ricaya olumlu ve somut cevap: Ja, gern. + pratik ayrıntı.`,rule:`Situation: Nachbarn / um Hilfe bitten`},{id:`dl-wiederhoeren`,q:`Wie verabschiedet man sich am Telefon?`,tr:`Telefonda nasıl vedalaşılır?`,o:[`Auf Wiederhören!`,`Guten Appetit!`,`Herzlich willkommen!`,`Gute Besserung!`],a:`Auf Wiederhören!`,ex:`Telefonda karşı tarafı görmediğimiz için „Auf Wiederhören“ (tekrar duyuşmak üzere) denir.`,rule:`Situation: Telefonieren / Termin`}]);function zi(e){return e.map(e=>({id:e.id,type:`reading`,category:`reading`,difficulty:e.d||`A2.1`,readingText:e.text,readingTitle:e.title,question:e.q,questionTr:e.tr,options:e.o,correctAnswer:e.a,explanation:e.ex,targetRule:e.rule,source:`bank`}))}var Bi=`Achtung an Gleis 4: Der ICE 578 nach München, planmäßige Abfahrt 14:12 Uhr, hat heute etwa 20 Minuten Verspätung. Wir bitten um Ihr Verständnis.`,Vi=`Praxis Dr. Kaya – Allgemeinmedizin

Frühstück: 7–10 Uhr im Restaurant (Erdgeschoss). Check-out bis 11 Uhr. Fahrräder können Sie an der Rezeption leihen (10 € pro Tag). Das WLAN ist kostenlos – das Passwort bekommen Sie an der Rezeption.`,Ji=`Was ist richtig?`,Yi=`Hangisi metne göre doğru?`,Xi=zi([{id:`lv-gleis`,title:`Durchsage am Bahnhof`,text:Bi,q:Ji,tr:Yi,o:[`Der Zug nach München fährt später ab.`,`Der Zug fährt heute nicht.`,`Der Zug fährt von Gleis 20.`,`Der Zug fährt 20 Minuten früher ab.`],a:`Der Zug nach München fährt später ab.`,ex:`„Verspätung“ = rötar. Tren yaklaşık 20 dakika geç kalkacak.`,rule:`Lesen: Durchsagen verstehen`},{id:`lv-praxis-1`,title:`Aushang Arztpraxis`,text:Vi,q:`Frau Yılmaz möchte am Donnerstag um 16 Uhr zum Arzt. Die Praxis ist dann …`,tr:`Bayan Yılmaz perşembe saat 16’da doktora gitmek istiyor. Muayenehane o saatte …`,o:[`geöffnet.`,`geschlossen.`,`nur für Notfälle offen.`,`nur vormittags offen.`],a:`geöffnet.`,ex:`Salı ve perşembe ayrıca 15–18 arası açık → 16:00’da açık.`,rule:`Lesen: Öffnungszeiten verstehen`},{id:`lv-praxis-2`,title:`Aushang Arztpraxis`,text:Vi,q:`Wann ist die Praxis geschlossen?`,tr:`Muayenehane ne zaman kapalı?`,o:[`Am Mittwochnachmittag.`,`Am Dienstagvormittag.`,`Am Freitagvormittag.`,`Am Montagvormittag.`],a:`Am Mittwochnachmittag.`,ex:`„Mittwochnachmittag geschlossen“ açıkça yazıyor.`,rule:`Lesen: Öffnungszeiten verstehen`},{id:`lv-jonas-1`,title:`E-Mail von Jonas`,text:Hi,q:`Warum kommt Jonas nicht zur Party?`,tr:`Jonas partiye neden gelmiyor?`,o:[`Seine Eltern besuchen ihn.`,`Er ist krank.`,`Er muss arbeiten.`,`Er hat kein Geschenk.`],a:`Seine Eltern besuchen ihn.`,ex:`„… weil meine Eltern zu Besuch kommen.“`,rule:`Lesen: E-Mails verstehen`},{id:`lv-jonas-2`,title:`E-Mail von Jonas`,text:Hi,q:`Was schlägt Jonas vor?`,tr:`Jonas ne öneriyor?`,o:[`Ein Treffen am Sonntag.`,`Eine Party am Sonntag.`,`Einen Besuch bei seinen Eltern.`,`Ein Treffen am Samstag.`],a:`Ein Treffen am Sonntag.`,ex:`„Können wir uns vielleicht am Sonntag zum Kaffee treffen?“`,rule:`Lesen: E-Mails verstehen`},{id:`lv-wohnung-1`,title:`Wohnungsanzeige`,text:Ui,q:Ji,tr:Yi,o:[`In der Wohnung darf man keine Katze haben.`,`Die Wohnung hat keinen Aufzug.`,`Man kann den ganzen Tag anrufen.`,`In der Küche gibt es keine Geräte.`],a:`In der Wohnung darf man keine Katze haben.`,ex:`„Haustiere leider nicht erlaubt“ → evcil hayvan (kedi de) yasak.`,rule:`Lesen: Anzeigen verstehen`},{id:`lv-wohnung-2`,title:`Wohnungsanzeige`,text:Ui,q:`Ab wann ist die Wohnung frei?`,tr:`Daire ne zamandan itibaren boş?`,o:[`Ab dem 1. März.`,`Ab sofort.`,`Ab 18 Uhr.`,`Ab dem 3. März.`],a:`Ab dem 1. März.`,ex:`„Frei ab 1. März.“ („ab 18 Uhr“ telefon saatidir.)`,rule:`Lesen: Anzeigen verstehen`},{id:`lv-vhs-1`,title:`Kursangebot`,text:Wi,q:`Was muss man selbst mitbringen?`,tr:`Kursa ne getirmek gerekiyor?`,o:[`Eine Schürze.`,`Lebensmittel.`,`Ein Kochbuch.`,`Teller und Gläser.`],a:`Eine Schürze.`,ex:`„Bitte eine Schürze mitbringen.“ Yiyecekler fiyata dahil (inklusive).`,rule:`Lesen: Anzeigen verstehen`},{id:`lv-vhs-2`,title:`Kursangebot`,text:Wi,q:`Bis wann muss man sich anmelden?`,tr:`En geç ne zamana kadar kayıt yaptırmak gerekiyor?`,o:[`Bis zum 25. September.`,`Bis zum 4. Oktober.`,`Bis zum ersten Dienstag.`,`Man muss sich nicht anmelden.`],a:`Bis zum 25. September.`,ex:`„Anmeldung bis 25. September.“`,rule:`Lesen: Anzeigen verstehen`},{id:`lv-sms-1`,title:`SMS von Tom`,text:Gi,q:`Was soll Mira machen?`,tr:`Mira ne yapmalı?`,o:[`Kinokarten kaufen.`,`Tom abholen.`,`Nach Hause gehen.`,`Den Film absagen.`],a:`Kinokarten kaufen.`,ex:`„Kannst du schon mal Tickets für den Film um 20 Uhr kaufen?“`,rule:`Lesen: Kurznachrichten verstehen`},{id:`lv-sms-2`,title:`SMS von Tom`,text:Gi,q:`Warum kommt Tom später?`,tr:`Tom neden geç kalıyor?`,o:[`Es gibt viel Verkehr.`,`Er hat den Bus verpasst.`,`Er muss noch arbeiten.`,`Er hat die Tickets vergessen.`],a:`Es gibt viel Verkehr.`,ex:`„Ich stehe im Stau“ = trafik sıkışıklığındayım.`,rule:`Lesen: Kurznachrichten verstehen`},{id:`lv-markt-1`,title:`Aushang im Supermarkt`,text:Ki,q:`Am Samstag um 6:45 Uhr kann man …`,tr:`Cumartesi saat 6:45’te …`,o:[`nur in der Bäckerei einkaufen.`,`im ganzen Supermarkt einkaufen.`,`nichts einkaufen.`,`nur Getränke kaufen.`],a:`nur in der Bäckerei einkaufen.`,ex:`Market 7’de açılıyor; fırın ise 6:30’da. 6:45’te sadece fırın açık.`,rule:`Lesen: Öffnungszeiten verstehen`,d:`A2.2`},{id:`lv-markt-2`,title:`Aushang im Supermarkt`,text:Ki,q:`Am Sonntag ist der Supermarkt …`,tr:`Pazar günü market …`,o:[`geschlossen.`,`von 7 bis 22 Uhr geöffnet.`,`ab 6:30 Uhr geöffnet.`,`nur vormittags geöffnet.`],a:`geschlossen.`,ex:`„An Sonn- und Feiertagen bleibt der Markt geschlossen.“`,rule:`Lesen: Öffnungszeiten verstehen`},{id:`lv-hotel-1`,title:`Hotelinformation`,text:qi,q:`Wofür muss man extra bezahlen?`,tr:`Hangisi için ayrıca ödeme yapmak gerekir?`,o:[`Für ein Fahrrad.`,`Für das WLAN.`,`Für das Passwort.`,`Für den Check-out.`],a:`Für ein Fahrrad.`,ex:`Bisiklet günlüğü 10 €; WLAN ücretsiz (kostenlos).`,rule:`Lesen: Informationen verstehen`},{id:`lv-hotel-2`,title:`Hotelinformation`,text:qi,q:`Bis wann muss man das Zimmer verlassen?`,tr:`Odadan en geç saat kaçta çıkılmalı?`,o:[`Bis 11 Uhr.`,`Bis 10 Uhr.`,`Bis 7 Uhr.`,`Bis 22 Uhr.`],a:`Bis 11 Uhr.`,ex:`„Check-out bis 11 Uhr.“ (10 Uhr kahvaltının bitişi.)`,rule:`Lesen: Informationen verstehen`}]);function Zi(e){return e.map(e=>({id:e.id,type:`sentence_build`,category:`sentence_syntax`,difficulty:e.d||`A2.1`,question:`Bilden Sie einen korrekten Satz.`,questionTr:e.tr,sentenceParts:e.parts,correctAnswer:e.parts.join(` `),acceptedAnswers:e.alt,explanation:e.ex,targetRule:e.rule,source:`bank`}))}var Qi=Zi([{id:`sb-morgen`,parts:[`Morgen`,`fahre`,`ich`,`mit dem Zug`,`nach Berlin.`],tr:`Yarın trenle Berlin’e gidiyorum.`,ex:`Zaman zarfı başta → fiil 2. sırada, özne fiilden sonra (Inversion).`,rule:`Satzbau: Verb an Position 2 (Inversion)`},{id:`sb-weil`,parts:[`Ich`,`bleibe`,`zu Hause,`,`weil`,`ich`,`krank`,`bin.`],tr:`Hasta olduğum için evde kalıyorum.`,ex:`„weil“ yan cümlesinde çekimli fiil (bin) en sondadır.`,rule:`Nebensatz: weil + Verb am Ende`},{id:`sb-perfekt`,parts:[`Gestern`,`bin`,`ich`,`ins Kino`,`gegangen.`],tr:`Dün sinemaya gittim.`,ex:`Perfekt: yardımcı fiil (bin) 2. sırada, Partizip (gegangen) en sonda.`,rule:`Satzbau: Satzklammer im Perfekt`},{id:`sb-helfen`,parts:[`Kannst`,`du`,`mir`,`bitte`,`helfen?`],alt:[`Kannst du bitte mir helfen?`],tr:`Bana yardım edebilir misin lütfen?`,ex:`Evet/hayır sorusu fiille başlar; modal fiil başta, mastar sonda.`,rule:`Modalverben: Infinitiv am Satzende`},{id:`sb-aufstehen`,parts:[`Ich`,`stehe`,`jeden Tag`,`um sieben Uhr`,`auf.`],alt:[`Ich stehe um sieben Uhr jeden Tag auf.`],tr:`Her gün saat yedide kalkarım.`,ex:`Ayrılabilen fiil: çekimli kısım (stehe) 2. sırada, ön ek (auf) en sonda.`,rule:`Trennbare Verben: Präfix am Satzende`},{id:`sb-deshalb`,parts:[`Er`,`ist`,`müde,`,`deshalb`,`geht`,`er`,`früh`,`ins Bett.`],tr:`O yorgun, bu yüzden erken yatıyor.`,ex:`„deshalb“tan hemen sonra fiil gelir: deshalb geht er …`,rule:`Konnektoren: deshalb/trotzdem + Inversion`,d:`A2.2`},{id:`sb-dass`,parts:[`Ich`,`weiß,`,`dass`,`du`,`keine Zeit`,`hast.`],tr:`Vaktinin olmadığını biliyorum.`,ex:`„dass“ yan cümlesinde fiil (hast) sondadır.`,rule:`Nebensatz: dass + Verb am Ende`},{id:`sb-anfangen`,parts:[`Wann`,`fängt`,`der Deutschkurs`,`an?`],tr:`Almanca kursu ne zaman başlıyor?`,ex:`W-sorusu: soru kelimesi + fiil + özne … + ön ek.`,rule:`Satzbau: W-Frage (Verb an Position 2)`},{id:`sb-modal`,parts:[`Am Wochenende`,`möchte`,`ich`,`meine Oma`,`besuchen.`],tr:`Hafta sonu büyükannemi ziyaret etmek istiyorum.`,ex:`Modal fiil 2. sırada, mastar sonda; zaman ifadesi başta olduğu için özne fiilden sonra.`,rule:`Modalverben: Infinitiv am Satzende`},{id:`sb-obwohl`,parts:[`Obwohl`,`es`,`regnet,`,`gehen`,`wir`,`spazieren.`],tr:`Yağmur yağmasına rağmen yürüyüşe çıkıyoruz.`,ex:`Yan cümle başta → ana cümle fiille başlar (gehen wir).`,rule:`Satzbau: Nebensatz auf Position 1 → Verb – Subjek wie geht es dir? Ich hoffe, du hast deine Prüfung gut geschafft! Bei mir gibt es viele Neuigkeiten: Seit drei Wochen wohne ich in Hamburg. Meine neue Wohnung liegt im Stadtteil Altona, nicht weit vom Bahnhof. Sie hat zwei Zimmer, eine kleine Küche und einen Balkon. Leider gibt es keinen Aufzug, und ich wohne im vierten Stock. Am Anfang war das anstrengend, besonders mit den schweren Kartons! Zum Glück haben mir zwei Kollegen beim Umzug geholfen.

Meine Nachbarn sind sehr nett. Die alte Dame von nebenan hat mir am ersten Tag einen Kuchen gebracht. Der junge Mann unter mir spielt abends manchmal Gitarre, aber das stört mich nicht. Ich finde es sogar schön.

Die Arbeit in der neuen Firma macht mir Spaß. Ich fahre jeden Morgen zwanzig Minuten mit der S-Bahn ins Büro. Das ist viel besser als früher, denn in München musste ich jeden Tag eine Stunde mit dem Auto fahren und stand oft im Stau.

Hast du im Mai Zeit? Dann kannst du mich besuchen! Wir können zusammen an der Elbe spazieren gehen und Fischbrötchen essen. Das Gästebett ist schon da.

Schreib mir bald!
Viele Grüße
deine Lena`,questions:[{q:`Seit wann wohnt Lena in Hamburg?`,tr:`Lena ne zamandan beri Hamburg’da yaşıyor?`,o:[`Seit drei Wochen.`,`Seit drei Monaten.`,`Seit Mai.`,`Seit einem Jahr.`],a:`Seit drei Wochen.`,ex:`„Seit drei Wochen wohne ich in Hamburg.“`},{q:`Was ist ein Problem in der Wohnung?`,tr:`Dairedeki sorun ne?`,o:[`Es gibt keinen Aufzug.`,`Die Küche ist zu groß.`,`Die Nachbarn sind unfreundlich.`,`Die Wohnung ist weit vom Bahnhof.`],a:`Es gibt keinen Aufzug.`,ex:`„Leider gibt es keinen Aufzug, und ich wohne im vierten Stock.“`},{q:`Wie fährt Lena jetzt zur Arbeit?`,tr:`Lena şimdi işe nasıl gidiyor?`,o:[`Mit der S-Bahn.`,`Mit dem Auto.`,`Mit dem Fahrrad.`,`Zu Fuß.`],a:`Mit der S-Bahn.`,ex:`„Ich fahre jeden Morgen zwanzig Minuten mit der S-Bahn ins Büro.“`},{q:`Was schlägt Lena vor?`,tr:`Lena ne öneriyor?`,o:[`Selin soll sie im Mai besuchen.`,`Selin soll nach München fahren.`,`Sie wollen zusammen umziehen.`,`Selin soll einen Kuchen backen.`],a:`Selin soll sie im Mai besuchen.`,ex:`„Hast du im Mai Zeit? Dann kannst du mich besuchen!“`}],trueFalse:[{s:`Zwei Kollegen haben Lena beim Umzug geholfen.`,correct:!0},{s:`Die Gitarrenmusik stört Lena sehr.`,correct:!1},{s:`In München ist Lena mit dem Auto zur Arbeit gefahren.`,correct:!0}],phrases:[{de:`Zum Glück haben mir zwei Kollegen geholfen.`,tr:`Neyse ki iki iş arkadaşım bana yardım etti.`},{de:`Das stört mich nicht.`,tr:`Bu beni rahatsız etmiyor.`},{de:`Die Arbeit macht mir Spaß.`,tr:`İş hoşuma gidiyor.`},{de:`Schreib mir bald!`,tr:`Bana yakında yaz!`}]},{id:`lt-arzt`,title:`Ein Tag beim Arzt`,format:`Erzählung`,theme:`Gesundheit & Körper`,text:`Am Montagmorgen ist Murat mit starken Halsschmerzen aufgewacht. Er hatte auch Fieber und war sehr müde. Deshalb hat er sofort seine Chefin angerufen und gesagt, dass er nicht zur Arbeit kommen kann. Seine Chefin war sehr verständnisvoll: „Bleiben Sie zu Hause und gehen Sie zum Arzt. Gute Besserung!“

Dann hat Murat in der Praxis von Dr. Becker angerufen. Die Frau am Telefon hat gesagt, dass er um halb elf kommen kann. Er sollte seine Versichertenkarte mitbringen. Im Wartezimmer saßen schon viele Leute, und Murat musste fast eine Stunde warten.

Dr. Becker hat ihn genau untersucht. „Sie haben eine Grippe“, hat sie gesagt. „Sie müssen viel trinken und mindestens drei Tage im Bett bleiben. Ich schreibe Ihnen ein Rezept für ein Medikament gegen das Fieber.“ Außerdem hat Murat eine Krankmeldung für seinen Arbeitgeber bekommen.

Auf dem Weg nach Hause ist er noch zur Apotheke gegangen und hat das Medikament geholt. Zu Hause hat er sich einen heißen Tee mit Honig gemacht und ist sofort ins Bett gegangen. Am Abend hat seine Schwester angerufen und gefragt, ob sie ihm etwas zu essen bringen soll. Murat hat sich sehr gefreut. Nach vier Tagen war er wieder gesund.`,questions:[{q:`Was hat Murat zuerst gemacht?`,tr:`Murat ilk olarak ne yaptı?`,o:[`Er hat seine Chefin angerufen.`,`Er ist zur Apotheke gegangen.`,`Er hat Tee getrunken.`,`Er hat seine Schwester angerufen.`],a:`Er hat seine Chefin angerufen.`,ex:`„Deshalb hat er sofort seine Chefin angerufen …“`},{q:`Wie lange musste Murat im Wartezimmer warten?`,tr:`Murat bekleme odasında ne kadar beklemek zorunda kaldı?`,o:[`Fast eine Stunde.`,`Eine halbe Stunde.`,`Drei Stunden.`,`Gar nicht.`],a:`Fast eine Stunde.`,ex:`„… Murat musste fast eine Stunde warten.“`},{q:`Was hat die Ärztin gesagt?`,tr:`Doktor ne dedi?`,o:[`Er soll mindestens drei Tage im Bett bleiben.`,`Er soll sofort wieder arbeiten.`,`Er braucht kein Medikament.`,`Er soll ins Krankenhaus gehen.`],a:`Er soll mindestens drei Tage im Bett bleiben.`,ex:`„Sie müssen viel trinken und mindestens drei Tage im Bett bleiben.“`},{q:`Was wollte seine Schwester machen?`,tr:`Kız kardeşi ne yapmak istedi?`,o:[`Ihm etwas zu essen bringen.`,`Ihn zum Arzt fahren.`,`Seine Chefin anrufen.`,`Das Medikament holen.`],a:`Ihm etwas zu essen bringen.`,ex:`„… gefragt, ob sie ihm etwas zu essen bringen soll.“`}],trueFalse:[{s:`Murats Chefin war böse, weil er nicht kommen konnte.`,correct:!1},{s:`Murat hat das Medikament in der Apotheke geholt.`,correct:!0},{s:`Murat war nach zwei Tagen wieder gesund.`,correct:!1}],phrases:[{de:`Ich kann heute nicht zur Arbeit kommen.`,tr:`Bugün işe gelemiyorum.`},{de:`Bringen Sie bitte Ihre Versichertenkarte mit.`,tr:`Lütfen sigorta kartınızı getirin.`},{de:`Ich schreibe Ihnen ein Rezept.`,tr:`Size bir reçete yazıyorum.`},{de:`Gute Besserung!`,tr:`Geçmiş olsun!`}]},{id:`lt-berge`,title:`Ein Wochenende in den Bergen`,format:`Blog`,theme:`Reisen & Verkehr`,text:`Mein Blog: Unterwegs mit Jana

Letztes Wochenende waren mein Freund Paul und ich in den Alpen. Wir sind am Freitagnachmittag mit dem Zug nach Garmisch-Partenkirchen gefahren. Die Fahrt von München hat nur eineinhalb Stunden gedauert. Unsere Pension war klein, aber sehr gemütlich, und das Frühstück war fantastisch: frisches Brot, Käse aus der Region und selbst gemachte Marmelade.

Am Samstag wollten wir eigentlich auf die Zugspitze wandern. Aber das Wetter war leider schlecht: Es war neblig und es hat viel geregnet. Deshalb sind wir mit der Bahn auf den Berg gefahren. Oben war es sehr kalt, nur zwei Grad! Wir haben fast nichts gesehen, aber im Restaurant haben wir eine heiße Schokolade getrunken und viel gelacht.

Am Sonntag war das Wetter dann perfekt. Die Sonne hat geschienen und der Himmel war blau. Wir haben eine lange Wanderung um einen See gemacht. Unterwegs haben wir ein Picknick gemacht und viele Fotos gemacht. Am Abend sind wir müde, aber glücklich nach Hause gefahren.

Mein Tipp für euch: Nehmt immer eine warme Jacke und eine Regenjacke mit, auch im Sommer! In den Bergen kann sich das Wetter sehr schnell ändern.`,questions:[{q:`Wie sind Jana und Paul nach Garmisch-Partenkirchen gefahren?`,tr:`Jana ve Paul Garmisch-Partenkirchen’e nasıl gittiler?`,o:[`Mit dem Zug.`,`Mit dem Auto.`,`Mit dem Bus.`,`Mit dem Fahrrad.`],a:`Mit dem Zug.`,ex:`„Wir sind am Freitagnachmittag mit dem Zug … gefahren.“`},{q:`Warum sind sie am Samstag nicht gewandert?`,tr:`Cumartesi neden yürüyüş yapmadılar?`,o:[`Das Wetter war schlecht.`,`Paul war krank.`,`Die Bahn war kaputt.`,`Sie waren zu müde.`],a:`Das Wetter war schlecht.`,ex:`„Aber das Wetter war leider schlecht: Es war neblig und es hat viel geregnet.“`},{q:`Was haben sie am Sonntag gemacht?`,tr:`Pazar günü ne yaptılar?`,o:[`Sie sind um einen See gewandert.`,`Sie sind auf die Zugspitze gefahren.`,`Sie sind in der Pension geblieben.`,`Sie sind einkaufen gegangen.`],a:`Sie sind um einen See gewandert.`,ex:`„Wir haben eine lange Wanderung um einen See gemacht.“`},{q:`Was ist Janas Tipp?`,tr:`Jana’nın tavsiyesi ne?`,o:[`Immer eine warme Jacke und eine Regenjacke mitnehmen.`,`Nie im Sommer in die Berge fahren.`,`Immer mit dem Auto fahren.`,`In den Bergen kein Picknick machen.`],a:`Immer eine warme Jacke und eine Regenjacke mitnehmen.`,ex:`„Nehmt immer eine warme Jacke und eine Regenjacke mit …“`}],trueFalse:[{s:`Die Fahrt von München hat eineinhalb Stunden gedauert.`,correct:!0},{s:`Auf der Zugspitze war es sehr warm.`,correct:!1},{s:`Am Sonntag hat die Sonne geschienen.`,correct:!0}],phrases:[{de:`Die Fahrt hat nur eineinhalb Stunden gedauert.`,tr:`Yolculuk sadece bir buçuk saat sürdü.`},{de:`Wir wollten eigentlich wandern.`,tr:`Aslında yürüyüş yapmak istiyorduk.`},{de:`Das Wetter kann sich schnell ändern.`,tr:`Hava çabuk değişebilir.`},{de:`Wir sind müde, aber glücklich nach Hause gefahren.`,tr:`Yorgun ama mutlu eve döndük.`}]},{id:`lt-stelle`,title:`Die neue Stelle`,format:`E-Mail`,theme:`Arbeit & Beruf`,text:`Sehr geehrte Frau Hoffmann,

vielen Dank für das freundliche Gespräch am letzten Dienstag. Ich freue mich sehr, dass ich die Stelle als Verkäufer in Ihrem Sportgeschäft bekomme.

Sie haben mich gebeten, Ihnen noch einige Informationen zu schicken. Im Anhang finden Sie meinen Lebenslauf, eine Kopie von meinem Zeugnis und meine Kontodaten. Die Kopie von meinem Ausweis bringe ich am ersten Arbeitstag mit.

Ich habe noch eine Frage zu den Arbeitszeiten. Im Gespräch haben Sie gesagt, dass ich manchmal auch am Samstag arbeiten muss. Das ist kein Problem für mich. Aber am Mittwochnachmittag besuche ich bis Ende Juni einen Deutschkurs an der Volkshochschule. Wäre es möglich, dass ich an diesem Tag nur vormittags arbeite? Natürlich kann ich die Stunden an einem anderen Tag nacharbeiten.

Außerdem möchte ich fragen, ob ich am ersten Tag besondere Kleidung brauche oder ob ich von Ihnen ein T-Shirt mit dem Logo bekomme. Und wo kann ich mein Fahrrad abstellen? Ich wohne nicht weit vom Geschäft und möchte gern mit dem Rad zur Arbeit fahren.

Ich freue mich auf die Arbeit in Ihrem Team und auf meinen ersten Arbeitstag am 1. Juli.

Mit freundlichen Grüßen

teuer. Auf dem Markt gibt es viel zu sehen: Obst und Gemüse aus der Region, frischen Fisch, Blumen, Käse und Brot.

Frau Schneider kauft am liebsten bei Bauer Krüger ein. Seine Kartoffeln und Tomaten sind nicht billig, aber sie schmecken viel besser als die Tomaten aus dem Supermarkt. Außerdem kennt sie Herrn Krüger schon lange, und die beiden sprechen immer ein bisschen über das Wetter und die Familie.
